<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Hallucine: browser auto-translation rewrote the animated HUD text into nonsense. -->
  <meta name="google" content="notranslate" />
  <title>God's Eye View</title>
  <!-- Raster fallbacks: Safari ignores an SVG apple-touch-icon and falls back to a
       screenshot of the page, so an installed app needs a real PNG. Regenerate
       these from the logo with `node scripts/generate-icons.mjs`. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <!-- Listed after the PNG: browsers that use the last usable icon keep the SVG
       for the tab. -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="God's Eye" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- Icon font subset to the glyphs this app renders. Keep `icon_names` in sync
       with the sources: src/materialSymbolsSubset.test.mjs fails when a source
       names a glyph this list is missing, because a missing glyph does not draw
       a box — the ligature never forms and the element renders the literal word. -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=adjust,arrow_drop_down,arrow_forward,arrow_left,arrow_right,bolt,chevron_left,chevron_right,close,close_fullscreen,dark_mode,draw,east,flare,flight,layers_clear,light_mode,local_fire_department,my_location,navigation,normal,on,open_in_full,public,radar,radio,right_panel_close,right_panel_open,rocket_launch,skip_next,skip_previous,upload_file,view_in_ar,visibility,visibility_off" rel="stylesheet" />
  <style>
    /* Hallucine: logo and way back to the site, under the God's Eye View brand. */
    #hallucine-retour { position: fixed; top: 118px; left: 40px; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border: 1px solid rgba(245, 184, 61, 0.45); border-radius: 999px; background: rgba(10, 10, 15, 0.72); color: #f5b83d; font: 500 12px/1 'JetBrains Mono', monospace; letter-spacing: 0.12em; text-decoration: none; text-transform: uppercase; backdrop-filter: blur(6px); }
    #hallucine-retour:hover { background: rgba(245, 184, 61, 0.14); }
    #hallucine-retour img { height: 32px; width: auto; }
    @media (max-width: 640px) { #hallucine-retour { top: 84px; left: 12px; } #hallucine-retour span { display: none; } #hallucine-retour { padding: 4px; } }
  </style>
</head>
<body>
  <a id="hallucine-retour" href="https://hallucinecran.fr" title="Hallucine — retour au site"><img src="/hallucine-logo.webp" alt="Hallucine" /><span>← hallucinecran</span></a>
  <script src="/hallucine-retour.js"></script>

</body>
</html>
